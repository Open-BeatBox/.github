name: Software or firmware bug
description: The GUI, acquisition tools or module firmware misbehaves
labels: ["bug", "needs triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: ["Control GUI", "Acquisition / analysis", "Module firmware", "Website", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected behaviour, actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Python version, and the commit or release you are on.
